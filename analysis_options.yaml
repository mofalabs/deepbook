include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # This SDK mirrors DeepBook Move / official TS-SDK identifiers verbatim
    # (FLOAT_SCALAR, pool keys, generated struct fields), so standard Dart
    # naming conventions are intentionally not enforced on the public API.
    constant_identifier_names: false
    non_constant_identifier_names: false
