name: deepbook
description: Dart SDK for DeepBook V3, the decentralized central limit order book on Sui. Aligned with the official @mysten/deepbook-v3 TypeScript SDK.
version: 0.1.0
homepage: https://github.com/mofalabs/deepbook
repository: https://github.com/mofalabs/deepbook
issue_tracker: https://github.com/mofalabs/deepbook/issues
topics:
  - sui
  - blockchain
  - deepbook
  - defi
  - web3

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  bcs: ^0.2.0
  sui: ^0.5.0
  dio: ^5.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
